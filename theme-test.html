<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Icon Test</title>
    <link rel="stylesheet" href="styles.css?v=1.1">
    <style>
        body {
            padding: 50px;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .test-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 8px;
        }
        
        .theme-toggle-test {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            padding: 0;
            margin: 10px;
        }
        
        .theme-icon-test {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        .sun-icon-test, .moon-icon-test {
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 24px;
            height: 24px;
            display: block !important;
            visibility: visible !important;
            stroke: white !important;
        }
    </style>
</head>
<body>
    <h1>Theme Icon Visibility Test</h1>
    
    <div class="test-section">
        <h2>Direct Icon Test (Outside Theme System)</h2>
        <p>These icons should always be visible:</p>
        
        <div style="display: flex; gap: 20px; margin: 20px 0;">
            <div>
                <p>Sun Icon:</p>
                <svg class="sun-icon-test" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </div>
            
            <div>
                <p>Moon Icon:</p>
                <svg class="moon-icon-test" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Theme Toggle Test (With Your CSS)</h2>
        <p>This uses your exact theme toggle structure:</p>
        
        <button class="theme-toggle-test" id="theme-toggle-test" aria-label="Toggle theme">
            <span class="theme-icon-test">
                <svg class="sun-icon-test" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon-test" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </span>
        </button>
        
        <div style="margin-top: 15px;">
            <button onclick="showBothIcons()">Show Both Icons</button>
            <button onclick="hideSunIcon()">Hide Sun Icon</button>
            <button onclick="hideMoonIcon()">Hide Moon Icon</button>
            <button onclick="checkVisibility()">Check Visibility</button>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Debug Info</h2>
        <div id="debug-output"></div>
    </div>

    <script>
        function log(message) {
            const output = document.getElementById('debug-output');
            output.innerHTML += `<p>${message}</p>`;
            console.log(message);
        }
        
        function showBothIcons() {
            const sunIcons = document.querySelectorAll('.sun-icon-test');
            const moonIcons = document.querySelectorAll('.moon-icon-test');
            
            sunIcons.forEach(icon => {
                icon.style.display = 'block';
                icon.style.visibility = 'visible';
            });
            
            moonIcons.forEach(icon => {
                icon.style.display = 'block';
                icon.style.visibility = 'visible';
            });
            
            log('Showed both icons');
        }
        
        function hideSunIcon() {
            const sunIcons = document.querySelectorAll('.sun-icon-test');
            sunIcons.forEach(icon => {
                icon.style.display = 'none';
                log('Hid sun icon');
            });
        }
        
        function hideMoonIcon() {
            const moonIcons = document.querySelectorAll('.moon-icon-test');
            moonIcons.forEach(icon => {
                icon.style.display = 'none';
                log('Hid moon icon');
            });
        }
        
        function checkVisibility() {
            const sunIcons = document.querySelectorAll('.sun-icon-test');
            const moonIcons = document.querySelectorAll('.moon-icon-test');
            
            log(`=== VISIBILITY CHECK ===`);
            log(`Found ${sunIcons.length} sun icons`);
            log(`Found ${moonIcons.length} moon icons`);
            
            sunIcons.forEach((icon, index) => {
                const computedStyle = window.getComputedStyle(icon);
                log(`Sun icon ${index}: display=${icon.style.display}, computed=${computedStyle.display}, visibility=${computedStyle.visibility}`);
            });
            
            moonIcons.forEach((icon, index) => {
                const computedStyle = window.getComputedStyle(icon);
                log(`Moon icon ${index}: display=${icon.style.display}, computed=${computedStyle.display}, visibility=${computedStyle.visibility}`);
            });
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('Page loaded');
            showBothIcons();
            checkVisibility();
            
            // Add click handler
            const toggleButton = document.getElementById('theme-toggle-test');
            if (toggleButton) {
                toggleButton.addEventListener('click', function() {
                    log('Theme toggle clicked');
                    checkVisibility();
                });
            }
        });
    </script>
</body>
</html>
